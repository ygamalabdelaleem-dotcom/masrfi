<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>محفظتي</title>
<meta name="description" content="محفظتي: إدارة المصروفات الشخصية، تعمل بدون إنترنت وبياناتك على جهازك فقط.">
<meta name="theme-color" content="#062a57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="محفظتي">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>try { var t = JSON.parse(localStorage.getItem('mywallet.v1')).prefs.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div id="lock" class="lock hidden">
  <div class="lock-box">
    <div class="lock-logo">💰</div>
    <h2>محفظتي</h2>
    <p>أدخل رمز PIN</p>
    <input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <button class="btn primary" id="pinGo">فتح</button>
    <button class="btn face hidden" id="faceGo"></button>
    <p id="pinErr" class="err"></p>
  </div>
</div>

<header class="top">
  <button id="back" class="back hidden" aria-label="رجوع">›</button>
  <h1 id="title">محفظتي</h1>
  <button id="bellBtn" class="icon-btn" aria-label="الإشعارات"></button>
  <button id="themeBtn" class="icon-btn" aria-label="الوضع الليلي"></button>
  <button id="settingsBtn" class="icon-btn" aria-label="الإعدادات">⚙️</button>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="home" class="on"><span></span>الرئيسية</button>
  <button data-tab="txns"><span></span>الحركات</button>
  <button data-tab="add" class="add" aria-label="إضافة حركة"><span></span></button>
  <button data-tab="stats"><span></span>الإحصائيات</button>
  <button data-tab="more"><span></span>المزيد</button>
</nav>

<div id="sheet" class="sheet hidden">
  <div class="sheet-bg"></div>
  <div class="sheet-card">
    <div class="sheet-head"><b id="sheetTitle"></b><button class="x" id="sheetClose">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<button id="vfab" class="vfab" aria-label="المساعد الصوتي"></button>
<div id="vbubble" class="vbubble hidden"></div>
<div id="iosHint" class="ios-hint hidden">
  لتثبيت التطبيق على الآيفون: اضغط زر المشاركة <b>⬆︎</b> في Safari ثم <b>«إضافة إلى الشاشة الرئيسية»</b>.
  <button class="x" id="iosHintClose">✕</button>
</div>

<script src="app.js"></script>
</body>
</html>
